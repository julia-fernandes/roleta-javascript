<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roleta</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Roleta JavaScript</h1>

    <!-- divisões para alinhamento dos elementos -->
    <div id="tela">
      <div id="roleta">
        <div id="circulo"></div>

        <button id="botao-girar">Girar</button>
      </div>

      <div id="opcoes">
        <input id="entrada" />
        <button id="botao-add">Adicionar</button>
        <hr />

        <h4>Possibilidades:</h4>
        <ul id="listagem"></ul>
      </div>
    </div>

    <div id="caixa-destaque">
      <p>
        Resultado: <span id="resultado"></span>
        <!-- span para agrupar texto-->
      </p>

      <button id="botao-remover">Remover</button>
      <button id="botao-fechar">Fechar</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
